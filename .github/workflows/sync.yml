name: Wöchentlicher Phishing-Listen Sync

on:
  schedule:
    # Läuft jeden Sonntag um 00:00 Uhr UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Erlaubt es Ihnen, den Sync jederzeit manuell per Klick zu starten

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Erzwingt, dass die Schreibrechte aktiv bleiben

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Skript ausführen und Liste aktualisieren
      run: python update_list.py

    # DIESER NEUE SCHRITT ERSETZT DEN FEHLERHAFTEN GIT PUSH
    - name: Änderungen automatisch hochladen
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update phishing_list.json"
        file_pattern: 'phishing_list.json'
