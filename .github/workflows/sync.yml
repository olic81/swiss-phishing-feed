name: Wöchentlicher Phishing-Listen Sync

on:
  schedule:
    # Läuft jeden Sonntag um 00:00 Uhr UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Erlaubt Ihnen, den Lauf jederzeit manuell zu starten

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Skript ausführen (Erzeugt das JSON im richtigen Verzeichnis)
      run: python update_list.py

    # DIESER GEPRÜFTE BAUSTEIN ERSETZT DEN FEHLERHAFTEN GIT-ADD BLOCK
    - name: Änderungen automatisch erkennen und hochladen
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update phishing_list.json"
        file_pattern: 'phishing_list.json'
