name: Wöchentlicher Phishing-Listen Sync

on:
  schedule:
    - cron: '0 0 * * 0' # Jeden Sonntag um 00:00 Uhr
  workflow_dispatch: # Erlaubt manuellen Start per Klick

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Skript ausführen und Liste aktualisieren
      run: python update_list.py

    # DIESER SCHRITT ERSETZT DAS FEHLERHAFTE 'GIT ADD' UND BEHEBT DEN FEHLER 128 ENDGÜLTIG
    - name: Datei sicher hochladen
      uses: mikeal/publish-to-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: 'main'
