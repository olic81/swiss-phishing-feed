name: Wöchentlicher Phishing-Listen Sync

on:
  schedule:
    # Läuft jeden Sonntag um 00:00 Uhr UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Erlaubt es Ihnen, den Sync jederzeit manuell per Klick zu starten

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Skript ausführen und Liste aktualisieren
      run: python update_list.py

    - name: Änderungen zurück ins Repository pushen
      run: |
        git config --global user.name 'Phishing Bot'
        git config --global user.email 'bot@github.com'
        git add phishing_list.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update phishing_list.json" && git push)
