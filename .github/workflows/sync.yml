name: Wöchentlicher Phishing-Listen Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Tippfehler 'python-python-version' korrigiert!

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Skript ausführen
      run: python update_list.py
      env:
        # Hier übergeben wir den exakten Hauptordner als Umgebungsvariable
        TARGET_WORKSPACE: ${{ github.workspace }}

    - name: Änderungen automatisch hochladen
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update phishing_list.json"
        file_pattern: 'phishing_list.json'
